create policy "app_meta_read" on public.app_meta for select to authenticated, anon using (true);

create table if not exists public.profiles (
  user_id uuid primary key default auth.uid() references auth.users(id) on delete cascade,
  full_name text, email text, email_change_count int not null default 0,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.user_settings (
  user_id uuid primary key default auth.uid() references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.categories (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  name text not null,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.clients (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  name text not null, company text, email text, phone text, whatsapp text, country text, timezone text, address text, notes text,
  profile jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.projects (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  name text not null,
  client_id uuid references public.clients(id) on delete set null,
  category_id uuid references public.categories(id) on delete set null,
  custom_category text, website_url text, git_url text, hosting_info text,
  tech_stack text[] not null default '{}',
  project_stage text not null default 'running', status text not null default 'Lead', priority text not null default 'Medium',
  start_date date, delivery_date date, expected_start_date date,
  budget numeric, maintenance_plan boolean not null default false, notes text,
  archived boolean not null default false,
  last_health_check timestamptz, last_health_status text,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.payments (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  invoice_id text,
  client_id uuid references public.clients(id) on delete set null,
  project_id uuid references public.projects(id) on delete set null,
  amount numeric not null default 0, currency text not null default 'USD', payment_type text not null default 'Full',
  due_date date, status text not null default 'Due', paid_amount numeric not null default 0, paid_date date,
  payment_method text, notes text,
  invoice_sent_at timestamptz, invoice_send_count int not null default 0,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.notes (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  title text not null, content text, tags text[] not null default '{}',
  project_id uuid references public.projects(id) on delete set null,
  client_id uuid references public.clients(id) on delete set null,
  reminder_date timestamptz, reminder_type text not null default 'Email', reminder_repeat text not null default 'None',
  reminder_sent boolean not null default false,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.research (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  title text not null, links text[] not null default '{}', summary text, tags text[] not null default '{}',
  project_id uuid references public.projects(id) on delete set null,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
