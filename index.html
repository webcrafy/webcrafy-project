);

  due_date date, status text not null default 'Due', paid_amount numeric not null default 0, paid_date date,
  payment_method text, notes text,
  invoice_sent_at timestamptz, invoice_send_count int not null default 0,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.notes (

);
create table if not exists public.research (

);

-- v2: public "branding" storage for your logo (shown in invoice emails)
insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
  values ('branding', 'branding', true, 1048576, array['image/png','image/jpeg','image/webp','image/svg+xml'])
  on conflict (id) do update set public = true;
drop policy if exists "branding_read" on storage.objects;
create policy "branding_read" on storage.objects for select to authenticated
  using (bucket_id = 'branding' and (storage.foldername(name))[1] = auth.uid()::text);
drop policy if exists "branding_insert" on storage.objects;
create policy "branding_insert" on storage.objects for insert to authenticated
  with check (bucket_id = 'branding' and (storage.foldername(name))[1] = auth.uid()::text);
drop policy if exists "branding_update" on storage.objects;
create policy "branding_update" on storage.objects for update to authenticated
  using (bucket_id = 'branding' and (storage.foldername(name))[1] = auth.uid()::text);
drop policy if exists "branding_delete" on storage.objects;
create policy "branding_delete" on storage.objects for delete to authenticated
  using (bucket_id = 'branding' and (storage.foldername(name))[1] = auth.uid()::text);

-- v3: line items, discount, tax and a per-invoice payment link
alter table public.payments add column if not exists items jsonb not null default '[]'::jsonb;
alter table public.payments add column if not exists discount numeric not null default 0;
alter table public.payments add column if not exists tax_rate numeric not null default 0;
alter table public.payments add column if not exists payment_link text;

-- v4: logins (usernames and passwords) saved per project
create table if not exists public.credentials (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  project_id uuid not null references public.projects(id) on delete cascade,
  label text not null, url text, username text, password text, notes text,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
${aw("credentials")}
create index if not exists credentials_project_idx on public.credentials(project_id);

  uid text not null, event_type text, title text, start_time timestamptz, end_time timestamptz,
  attendee_name text, attendee_email text, attendee_tz text, location text, meeting_url text, notes text,
  status text not null default 'accepted', cancel_reason text, raw jsonb, seen boolean not null default false,
  client_id uuid references public.clients(id) on delete set null,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now(),
  unique (user_id, uid)
);
